<?xml version="1.0" encoding="UTF-8"?>
<svg id="stage" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated hooded mask character with chalkboard">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef6ef"/>
      <stop offset="1" stop-color="#d7e4d8"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33604a"/>
      <stop offset="1" stop-color="#27503d"/>
    </linearGradient>
    <linearGradient id="cloakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3db86a"/>
      <stop offset="1" stop-color="#2a8f4e"/>
    </linearGradient>
    <linearGradient id="maskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f6f8"/>
      <stop offset="0.45" stop-color="#c9d2d8"/>
      <stop offset="1" stop-color="#9aa6ae"/>
    </linearGradient>
    <linearGradient id="hoodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46c574"/>
      <stop offset="1" stop-color="#2f9a55"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#bgGrad)"/>

  <!-- CHALKBOARD — big & clean; the AI writes anything here -->
  <rect x="36" y="36" width="460" height="320" rx="12" fill="#5b4432"/>
  <rect x="52" y="52" width="428" height="288" rx="6" fill="url(#boardGrad)"/>
  <!-- chalk tray + chalk -->
  <rect x="150" y="348" width="220" height="10" rx="5" fill="#4a3626"/>
  <rect x="180" y="341" width="34" height="7" rx="3.5" fill="#f5f1e6" transform="rotate(-3 197 344)"/>
  <rect x="232" y="342" width="26" height="6" rx="3" fill="#f4a9a0" transform="rotate(4 245 345)"/>

  <!-- CHARACTER — same rig ids & pivot coords the engine expects -->
  <g id="professor">
    <!-- ground shadow (softer) -->
    <ellipse cx="612" cy="562" rx="96" ry="11" fill="#1c2330" opacity="0.10"/>

    <!-- cloak back layer -->
    <path d="M 548 250 Q 500 360 486 470 Q 520 500 612 508 Q 704 500 738 470 Q 724 360 676 250 Z" fill="url(#cloakGrad)" opacity="0.95"/>
    <path d="M 548 250 Q 500 360 486 470 Q 500 478 512 470 Q 546 360 572 268 Z" fill="#f2d35b" opacity="0.85"/>
    <path d="M 676 250 Q 724 360 738 470 Q 724 478 712 470 Q 678 360 652 268 Z" fill="#f2d35b" opacity="0.85"/>

    <!-- legs + shoes -->
    <path d="M 578 452 L 572 542 L 598 542 L 606 460 L 618 460 L 626 542 L 652 542 L 646 452 Z" fill="#2f9a55"/>
    <ellipse cx="585" cy="548" rx="20" ry="8" fill="#8a5a32"/>
    <ellipse cx="639" cy="548" rx="20" ry="8" fill="#8a5a32"/>
    <path d="M 565 538 Q 585 528 605 538 L 605 550 Q 585 556 565 550 Z" fill="#6e4524"/>
    <path d="M 619 538 Q 639 528 659 538 L 659 550 Q 639 556 619 550 Z" fill="#6e4524"/>

    <!-- torso group (breathing) — green tunic, gold belt -->
    <g id="torso">
      <path d="M 552 362 Q 556 338 612 332 Q 668 338 672 362 L 676 468 Q 612 482 548 468 Z" fill="url(#cloakGrad)"/>
      <path d="M 592 340 L 612 372 L 632 340 L 612 332 Z" fill="#2a8f4e"/>
      <path d="M 592 340 L 612 332 L 602 378 Z" fill="#248048"/>
      <path d="M 632 340 L 612 332 L 622 378 Z" fill="#248048"/>
      <!-- gold belt -->
      <rect x="562" y="418" width="100" height="16" rx="5" fill="#e6c04a"/>
      <rect x="564" y="420" width="96" height="5" rx="2" fill="#f6de7a"/>
      <rect x="598" y="416" width="28" height="20" rx="4" fill="#d4a62d"/>
      <circle cx="612" cy="426" r="5" fill="#f7e39a"/>
      <circle cx="612" cy="448" r="3.5" fill="#1f6f3c"/>
    </g>

    <g id="head">
      <!-- neck -->
      <rect x="598" y="314" width="28" height="26" rx="8" fill="#b8c2c8"/>

      <!-- ears hidden under hood; tiny hood side puffs kept for silhouette -->
      <circle cx="554" cy="276" r="10" fill="#3db86a"/>
      <circle cx="670" cy="276" r="10" fill="#3db86a"/>

      <!-- metal mask face -->
      <path d="M 667 272 C 667 306 650 328 612 330 C 574 328 557 306 557 272 C 557 230 580 211 612 211 C 644 211 667 230 667 272 Z" fill="url(#maskGrad)" stroke="#8e9aa3" stroke-width="2"/>

      <!-- mask cheek plates -->
      <circle cx="574" cy="294" r="7" fill="#aeb8bf" opacity="0.45"/>
      <circle cx="650" cy="294" r="7" fill="#aeb8bf" opacity="0.45"/>

      <!-- hood rim sitting over the mask -->
      <path d="M 559 252 Q 562 204 612 198 Q 662 204 665 252 Q 652 224 612 222 Q 572 224 559 252" fill="url(#hoodGrad)"/>
      <path d="M 560 248 q -7 16 0 32 q 11 -3 13 -14 q -7 -7 -13 -18 Z" fill="#46c574"/>
      <path d="M 664 248 q 7 16 0 32 q -11 -3 -13 -14 q 7 -7 13 -18 Z" fill="#46c574"/>

      <!-- eyes group (blink squash) — triangular visor slits -->
      <g id="eyes">
        <path d="M 574 262 L 602 268 L 574 278 Z" fill="#1a1f24"/>
        <path d="M 650 262 L 622 268 L 650 278 Z" fill="#1a1f24"/>
        <circle id="pupil-l" cx="588" cy="270" r="4.2" fill="#f7fbff"/>
        <circle id="pupil-r" cx="636" cy="270" r="4.2" fill="#f7fbff"/>
        <circle cx="589.5" cy="268.2" r="1.3" fill="#ffffff"/>
        <circle cx="637.5" cy="268.2" r="1.3" fill="#ffffff"/>
      </g>

      <!-- brows — sharp mask ridges -->
      <path id="brow-l" d="M 568 238 Q 586 226 603 235" fill="none" stroke="#6f7b84" stroke-width="7" stroke-linecap="round"/>
      <path id="brow-r" d="M 621 235 Q 638 226 656 238" fill="none" stroke="#6f7b84" stroke-width="7" stroke-linecap="round"/>

      <!-- nose ridge -->
      <path d="M 612 274 Q 606 292 613 298" fill="none" stroke="#8e9aa3" stroke-width="4" stroke-linecap="round"/>

      <!-- grill / teeth plate -->
      <path d="M 588 303 Q 612 295 636 303 Q 612 313 588 303" fill="#d7dee3"/>
      <path d="M 594 304 L 594 312" stroke="#8e9aa3" stroke-width="2" stroke-linecap="round"/>
      <path d="M 603 302 L 603 314" stroke="#8e9aa3" stroke-width="2" stroke-linecap="round"/>
      <path d="M 612 301 L 612 315" stroke="#8e9aa3" stroke-width="2" stroke-linecap="round"/>
      <path d="M 621 302 L 621 314" stroke="#8e9aa3" stroke-width="2" stroke-linecap="round"/>
      <path d="M 630 304 L 630 312" stroke="#8e9aa3" stroke-width="2" stroke-linecap="round"/>

      <!-- mouth — warmer smile hidden behind grill; engine still uses these ids -->
      <g id="mouth">
        <path id="mouth-smile" d="M 584 315 Q 612 341 640 315" fill="none" stroke="#6a737a" stroke-width="5" stroke-linecap="round"/>
        <ellipse id="mouth-open" cx="612" cy="322" rx="16" ry="10" fill="#4a5258" opacity="0"/>
      </g>

      <!-- hood peak used in place of graduation cap (same ids) -->
      <g id="cap">
        <path d="M 584 226 Q 612 198 640 226 L 640 234 Q 612 248 584 234 Z" fill="#2f9a55"/>
        <polygon points="612,176 686,208 612,228 538,208" fill="#3db86a" stroke="#247a44" stroke-width="2"/>
        <circle cx="612" cy="206" r="4.5" fill="#e6c04a"/>
        <g id="tassel">
          <path d="M 612 206 C 638 208 646 232 644 258" fill="none" stroke="#e6c04a" stroke-width="4" stroke-linecap="round"/>
          <circle cx="644" cy="262" r="7" fill="#e6c04a"/>
        </g>
      </g>
    </g>

    <!-- arms — layered in front of the head so raised hands pass in front of head/neck -->
    <!-- left arm (waves / thinks) -->
    <g id="arm-left">
      <path d="M 576 350 C 552 368 542 404 540 440" fill="none" stroke="#3db86a" stroke-width="26" stroke-linecap="round"/>
      <circle cx="538" cy="444" r="14" fill="#8a5a32"/>
      <circle cx="528" cy="438" r="5" fill="#6e4524"/>
      <circle cx="534" cy="456" r="5" fill="#6e4524"/>
      <circle cx="548" cy="450" r="5" fill="#6e4524"/>
    </g>
    <!-- right arm + pointer stick -->
    <g id="arm-right">
      <line x1="690" y1="446" x2="716" y2="488" stroke="#c9a06a" stroke-width="6" stroke-linecap="round"/>
      <path d="M 648 350 C 672 366 684 400 688 440" fill="none" stroke="#3db86a" stroke-width="26" stroke-linecap="round"/>
      <circle cx="688" cy="444" r="14" fill="#8a5a32"/>
      <circle cx="678" cy="438" r="5" fill="#6e4524"/>
      <circle cx="684" cy="456" r="5" fill="#6e4524"/>
      <circle cx="698" cy="450" r="5" fill="#6e4524"/>
    </g>
  </g>
</svg>